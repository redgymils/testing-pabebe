<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <title>LOCAL STREAM LIVE</title>

  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient-bg" aria-hidden="true"></div>

  <!-- Slide-Bar Navigation Panel -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Channel Navigation">
    <div class="drawer-header">
      <div class="brand">
        <span class="status-dot"></span>
        <span class="brand-title">Camera Feeds</span>
      </div>
      <button class="icon-btn" id="closeDrawerBtn" aria-label="Close navigation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="drawer-list" id="drawerList"></div>

    <div class="drawer-stats">
      <div>
        <span class="stat-label">Resolution</span>
        <span class="stat-value" id="statRes">—</span>
      </div>
      <div>
        <span class="stat-label">Bitrate</span>
        <span class="stat-value" id="statBitrate">—</span>
      </div>
      <div>
        <span class="stat-label">Protocol</span>
        <span class="stat-value">MPEG-DASH</span>
      </div>
      <div>
        <span class="stat-label">DRM</span>
        <span class="stat-value">ClearKey</span>
      </div>
    </div>
  </aside>

  <div class="app-shell">
    <!-- Top Glass Bar -->
    <header class="topbar glass">
      <div class="topbar-left">
        <button class="icon-btn" id="openDrawerBtn" aria-label="Open camera menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
        <div class="brand">
          <span class="brand-title">LOCAL STREAM LIVE</span>
          <span class="status-pill" id="statusPill">
            <span class="status-dot"></span>
            <span id="statusText">Online</span>
          </span>
        </div>
      </div>

      <div class="topbar-right">
        <div class="telemetry-badge" id="topTelemetry">HD • Auto</div>
        <button class="icon-btn" id="reloadBtn" title="Reload current stream" aria-label="Reload current stream">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Video Stage -->
    <main class="player-frame glass">
      <div class="video-stage controls-visible is-loading" id="videoStage">
        <video id="video" autoplay playsinline></video>

        <!-- Center Spinner / Error -->
        <div class="stage-center">
          <div class="spinner" aria-label="Loading stream"></div>
          <div class="error-card" id="errorCard">
            <div class="error-title">Stream Interrupted</div>
            <div class="error-msg" id="errorMsg">Unable to load the selected feed.</div>
            <button class="retry-btn" id="retryBtn">Retry Feed</button>
          </div>
        </div>

        <!-- 1-Tap Auto-Hiding Controls -->
        <div class="player-overlay" id="playerOverlay">
          <div class="overlay-top">
            <div class="active-feed-tag">
              <span class="status-dot"></span>
              <span id="overlayChannelName">Main Live</span>
            </div>
            <select class="quality-select" id="qualitySelect" aria-label="Video Quality">
              <option value="auto">Auto Quality</option>
            </select>
          </div>

          <div class="overlay-bottom" id="controlBar">
            <div class="ctrl-group">
              <button class="ctrl-btn" id="playPauseBtn" aria-label="Play or Pause">
                <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
              </button>
              <button class="ctrl-btn" id="muteBtn" aria-label="Mute or Unmute">
                <svg id="volIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              </button>
              <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
              <button class="live-sync-btn" id="liveSyncBtn" title="Jump to live edge">
                <span class="status-dot"></span>
                <span>LIVE</span>
              </button>
            </div>

            <div class="ctrl-group">
              <button class="ctrl-btn" id="pipBtn" title="Picture in Picture" aria-label="Picture in Picture">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1"/></svg>
              </button>
              <button class="ctrl-btn" id="fullscreenBtn" title="Fullscreen" aria-label="Fullscreen">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Camera Switcher Grid -->
    <section aria-label="Camera Feeds">
      <div class="section-header">
        <span class="section-title">Live Feeds</span>
        <span class="shortcut-hint">Keys 1–4 switch cams • Space play/pause • F fullscreen</span>
      </div>
      <div class="channel-grid" id="channelGrid"></div>
    </section>

    <footer class="footer">LOCAL STREAM LIVE</footer>
  </div>

  <!-- Load data.js BEFORE script.js -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
