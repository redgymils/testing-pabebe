<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <title>LOCAL STREAM LIVE</title>

  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>

  <style>
    :root {
      --bg-base: #070b14;
      --glass-bg: rgba(20, 26, 40, 0.56);
      --glass-bg-elevated: rgba(28, 36, 56, 0.72);
      --glass-border: rgba(255, 255, 255, 0.11);
      --glass-border-strong: rgba(255, 255, 255, 0.22);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.14);
      --text-primary: #f5f7fb;
      --text-secondary: rgba(235, 240, 250, 0.64);
      --text-muted: rgba(235, 240, 250, 0.38);
      --accent: #38bdf8;
      --online: #22c55e;
      --online-glow: 0 0 12px rgba(34, 197, 94, 0.85), 0 0 24px rgba(34, 197, 94, 0.4);
      --danger: #ef4444;
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-pill: 999px;
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
      --shadow-deep: 0 24px 64px -16px rgba(0, 0, 0, 0.72);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Ambient macOS-inspired mesh backdrop */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(60% 50% at 15% 10%, rgba(56, 189, 248, 0.14) 0%, transparent 65%),
        radial-gradient(50% 45% at 88% 18%, rgba(99, 102, 241, 0.14) 0%, transparent 65%),
        radial-gradient(55% 50% at 50% 95%, rgba(16, 185, 129, 0.08) 0%, transparent 70%),
        linear-gradient(180deg, #070b14 0%, #0b1120 100%);
    }

    /* App Shell */
    .app-shell {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px clamp(14px, 3vw, 28px) 24px;
      gap: 18px;
    }

    /* Glass Surface Utility */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(26px) saturate(165%);
      -webkit-backdrop-filter: blur(26px) saturate(165%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-highlight), var(--shadow-deep);
    }

    /* Top Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: var(--radius-lg);
      gap: 12px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: var(--glass-border-strong);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-title {
      font-size: 0.98rem;
      font-weight: 650;
      letter-spacing: -0.015em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.28);
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #86efac;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--online);
      box-shadow: var(--online-glow);
      animation: pulseOnline 2.2s ease-in-out infinite;
    }

    .status-pill.offline {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.32);
      color: #fca5a5;
    }

    .status-pill.offline .status-dot {
      background: var(--danger);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      animation: none;
    }

    @keyframes pulseOnline {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.88); }
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .telemetry-badge {
      font-size: 0.76rem;
      font-weight: 550;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      display: none;
    }

    @media (min-width: 640px) {
      .telemetry-badge { display: inline-flex; align-items: center; gap: 6px; }
    }

    /* Player Frame */
    .player-frame {
      border-radius: var(--radius-xl);
      padding: 10px;
    }

    .video-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #02040a;
      border-radius: calc(var(--radius-xl) - 8px);
      overflow: hidden;
      user-select: none;
      cursor: pointer;
    }

    .video-stage:fullscreen,
    .video-stage:-webkit-full-screen {
      border-radius: 0;
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    /* Auto-hiding Player Overlay */
    .player-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      background:
        linear-gradient(180deg, rgba(4, 7, 15, 0.72) 0%, transparent 28%, transparent 68%, rgba(4, 7, 15, 0.86) 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s var(--ease-spring);
    }

    .video-stage.controls-visible .player-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .active-feed-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      background: rgba(15, 23, 42, 0.58);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .quality-select {
      appearance: none;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      outline: none;
    }

    .quality-select option {
      background: #0f172a;
      color: #f8fafc;
    }

    .overlay-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 14px;
      background: rgba(12, 18, 32, 0.62);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .ctrl-btn:active {
      transform: scale(0.92);
    }

    .volume-slider {
      width: 74px;
      accent-color: var(--accent);
      cursor: pointer;
      display: none;
    }

    @media (min-width: 520px) {
      .volume-slider { display: block; }
    }

    .live-sync-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .live-sync-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Buffering & Error Center States */
    .stage-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 3;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.14);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .video-stage.is-loading .spinner {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-card {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 24px;
      border-radius: var(--radius-lg);
      background: rgba(15, 23, 42, 0.84);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(239, 68, 68, 0.3);
      text-align: center;
      max-width: 300px;
      pointer-events: auto;
    }

    .video-stage.has-error .error-card {
      display: flex;
    }

    .error-title {
      font-size: 0.92rem;
      font-weight: 650;
    }

    .error-msg {
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .retry-btn {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.18);
      color: #e0f2fe;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Camera Grid */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .section-title {
      font-size: 0.78rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .shortcut-hint {
      font-size: 0.74rem;
      color: var(--text-muted);
      display: none;
    }

    @media (min-width: 768px) {
      .shortcut-hint { display: inline; }
    }

    .channel-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    @media (min-width: 720px) {
      .channel-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .channel-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 15px 16px;
      border-radius: var(--radius-lg);
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(155%);
      -webkit-backdrop-filter: blur(22px) saturate(155%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-highlight);
      color: var(--text-primary);
      text-align: left;
      cursor: pointer;
      transition: transform 0.22s var(--ease-spring), background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .channel-card:hover {
      transform: translateY(-2px);
      background: rgba(30, 41, 64, 0.7);
      border-color: var(--glass-border-strong);
    }

    .channel-card:active {
      transform: scale(0.98);
    }

    .channel-card.active {
      background: linear-gradient(145deg, rgba(56, 189, 248, 0.16), rgba(30, 41, 64, 0.78));
      border-color: rgba(56, 189, 248, 0.48);
      box-shadow: var(--glass-highlight), 0 12px 32px -12px rgba(56, 189, 248, 0.35);
    }

    .card-top {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cam-code {
      font-size: 0.7rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .channel-card.active .cam-code {
      color: #7dd3fc;
    }

    .card-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    .channel-card.active .card-dot {
      background: var(--online);
      box-shadow: var(--online-glow);
    }

    .cam-name {
      font-size: 0.94rem;
      font-weight: 620;
      letter-spacing: -0.01em;
    }

    .cam-meta {
      font-size: 0.74rem;
      color: var(--text-secondary);
    }

    /* Slide-Bar Navigation Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(3, 6, 14, 0.56);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 12px;
      bottom: 12px;
      left: 12px;
      width: min(310px, calc(100vw - 24px));
      z-index: 50;
      border-radius: var(--radius-xl);
      background: var(--glass-bg-elevated);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1px solid var(--glass-border-strong);
      box-shadow: var(--glass-highlight), 0 32px 80px rgba(0, 0, 0, 0.78);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      transform: translateX(calc(-100% - 24px));
      transition: transform 0.34s var(--ease-spring);
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .drawer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .drawer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
      font-size: 0.88rem;
      font-weight: 560;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .drawer-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .drawer-item.active {
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .drawer-stats {
      margin-top: auto;
      padding: 14px;
      border-radius: var(--radius-md);
      background: rgba(0, 0, 0, 0.24);
      border: 1px solid rgba(255, 255, 255, 0.07);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 0.75rem;
    }

    .stat-label {
      color: var(--text-muted);
      display: block;
      margin-bottom: 2px;
    }

    .stat-value {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }

    /* Minimal Footer */
    .footer {
      margin-top: auto;
      padding-top: 8px;
      text-align: center;
      font-size: 0.74rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="ambient-bg" aria-hidden="true"></div>

  <!-- Slide-Bar Navigation Panel -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Channel Navigation">
    <div class="drawer-header">
      <div class="brand">
        <span class="status-dot"></span>
        <span class="brand-title">Camera Feeds</span>
      </div>
      <button class="icon-btn" id="closeDrawerBtn" aria-label="Close navigation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="drawer-list" id="drawerList"></div>

    <div class="drawer-stats">
      <div>
        <span class="stat-label">Resolution</span>
        <span class="stat-value" id="statRes">—</span>
      </div>
      <div>
        <span class="stat-label">Bitrate</span>
        <span class="stat-value" id="statBitrate">—</span>
      </div>
      <div>
        <span class="stat-label">Protocol</span>
        <span class="stat-value">MPEG-DASH</span>
      </div>
      <div>
        <span class="stat-label">DRM</span>
        <span class="stat-value">ClearKey</span>
      </div>
    </div>
  </aside>

  <div class="app-shell">
    <!-- Top Glass Bar -->
    <header class="topbar glass">
      <div class="topbar-left">
        <button class="icon-btn" id="openDrawerBtn" aria-label="Open camera menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </button>
        <div class="brand">
          <span class="brand-title">LOCAL STREAM LIVE</span>
          <span class="status-pill" id="statusPill">
            <span class="status-dot"></span>
            <span id="statusText">Online</span>
          </span>
        </div>
      </div>

      <div class="topbar-right">
        <div class="telemetry-badge" id="topTelemetry">HD • Auto</div>
        <button class="icon-btn" id="reloadBtn" title="Reload current stream" aria-label="Reload current stream">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Video Stage -->
    <main class="player-frame glass">
      <div class="video-stage controls-visible is-loading" id="videoStage">
        <video id="video" autoplay playsinline></video>

        <!-- Center Spinner / Error -->
        <div class="stage-center">
          <div class="spinner" aria-label="Loading stream"></div>
          <div class="error-card" id="errorCard">
            <div class="error-title">Stream Interrupted</div>
            <div class="error-msg" id="errorMsg">Unable to load the selected feed.</div>
            <button class="retry-btn" id="retryBtn">Retry Feed</button>
          </div>
        </div>

        <!-- 1-Tap Auto-Hiding Controls -->
        <div class="player-overlay" id="playerOverlay">
          <div class="overlay-top">
            <div class="active-feed-tag">
              <span class="status-dot"></span>
              <span id="overlayChannelName">Main Live</span>
            </div>
            <select class="quality-select" id="qualitySelect" aria-label="Video Quality">
              <option value="auto">Auto Quality</option>
            </select>
          </div>

          <div class="overlay-bottom" id="controlBar">
            <div class="ctrl-group">
              <button class="ctrl-btn" id="playPauseBtn" aria-label="Play or Pause">
                <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
              </button>
              <button class="ctrl-btn" id="muteBtn" aria-label="Mute or Unmute">
                <svg id="volIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              </button>
              <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
              <button class="live-sync-btn" id="liveSyncBtn" title="Jump to live edge">
                <span class="status-dot"></span>
                <span>LIVE</span>
              </button>
            </div>

            <div class="ctrl-group">
              <button class="ctrl-btn" id="pipBtn" title="Picture in Picture" aria-label="Picture in Picture">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1"/></svg>
              </button>
              <button class="ctrl-btn" id="fullscreenBtn" title="Fullscreen" aria-label="Fullscreen">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Camera Switcher Grid -->
    <section aria-label="Camera Feeds">
      <div class="section-header" style="margin-bottom: 10px;">
        <span class="section-title">Live Feeds</span>
        <span class="shortcut-hint">Keys 1–4 switch cams • Space play/pause • F fullscreen</span>
      </div>
      <div class="channel-grid" id="channelGrid"></div>
    </section>

    <footer class="footer">LOCAL STREAM LIVE</footer>
  </div>

  <script>
    const channels = [
      {
        code: "CAM 01",
        name: "Main Live",
        desc: "All-Access House Feed",
        url: "https://pbb-proxy.redgymils.workers.dev/api/live/mpd/all.mpd",
        kid: "b75e0a8315d0499b834c00a3d5b91935",
        key: "39876c3c4f32a11dee56078febbb67dd"
      },
      {
        code: "CAM 02",
        name: "Dining Area",
        desc: "Kitchen & Dining Hall",
        url: "https://pbb-proxy.redgymils.workers.dev/api/live/mpd/din.mpd",
        kid: "ea6588d030c94ca89925ac0c49974430",
        key: "3e6de4afee1eff8e14f9506b76ac9ee6"
      },
      {
        code: "CAM 03",
        name: "External Den",
        desc: "Outdoor & Den View",
        url: "https://pbb-proxy.redgymils.workers.dev/api/live/mpd/ext.mpd",
        kid: "b750a40736a24e60b5a4f256208b92c5",
        key: "af07292597f692726dcac2bd297ddf8e"
      },
      {
        code: "CAM 04",
        name: "Live Episode",
        desc: "Primetime Broadcast",
        url: "https://pbb-proxy.redgymils.workers.dev/api/live/mpd/main.mpd",
        kid: "1044e7ece2d741bcafe80d8613da104f",
        key: "f5e17f169ff05ea40c5d3f065f523942"
      }
    ];

    const els = {
      video: document.getElementById("video"),
      stage: document.getElementById("videoStage"),
      controlBar: document.getElementById("controlBar"),
      channelGrid: document.getElementById("channelGrid"),
      drawerList: document.getElementById("drawerList"),
      drawer: document.getElementById("drawer"),
      drawerBackdrop: document.getElementById("drawerBackdrop"),
      openDrawerBtn: document.getElementById("openDrawerBtn"),
      closeDrawerBtn: document.getElementById("closeDrawerBtn"),
      overlayChannelName: document.getElementById("overlayChannelName"),
      qualitySelect: document.getElementById("qualitySelect"),
      playPauseBtn: document.getElementById("playPauseBtn"),
      playIcon: document.getElementById("playIcon"),
      muteBtn: document.getElementById("muteBtn"),
      volIcon: document.getElementById("volIcon"),
      volumeSlider: document.getElementById("volumeSlider"),
      liveSyncBtn: document.getElementById("liveSyncBtn"),
      pipBtn: document.getElementById("pipBtn"),
      fullscreenBtn: document.getElementById("fullscreenBtn"),
      reloadBtn: document.getElementById("reloadBtn"),
      retryBtn: document.getElementById("retryBtn"),
      errorMsg: document.getElementById("errorMsg"),
      statusPill: document.getElementById("statusPill"),
      statusText: document.getElementById("statusText"),
      topTelemetry: document.getElementById("topTelemetry"),
      statRes: document.getElementById("statRes"),
      statBitrate: document.getElementById("statBitrate")
    };

    let player;
    let currentIndex = 0;
    let hideControlsTimer = null;

    function renderChannelUI() {
      els.channelGrid.innerHTML = channels.map((ch, i) => `
        <button class="channel-card" data-index="${i}">
          <div class="card-top">
            <span class="cam-code">${ch.code}</span>
            <span class="card-dot"></span>
          </div>
          <div class="cam-name">${ch.name}</div>
          <div class="cam-meta">${ch.desc}</div>
        </button>
      `).join("");

      els.drawerList.innerHTML = channels.map((ch, i) => `
        <button class="drawer-item" data-index="${i}">
          <span>${ch.name}</span>
          <span class="cam-code">${ch.code}</span>
        </button>
      `).join("");

      els.channelGrid.addEventListener("click", (e) => {
        const card = e.target.closest(".channel-card");
        if (card) switchStream(Number(card.dataset.index));
      });

      els.drawerList.addEventListener("click", (e) => {
        const item = e.target.closest(".drawer-item");
        if (item) {
          switchStream(Number(item.dataset.index));
          toggleDrawer(false);
        }
      });
    }

    function setOnlineStatus(isOnline, label = isOnline ? "Online" : "Offline") {
      els.statusPill.classList.toggle("offline", !isOnline);
      els.statusText.textContent = label;
    }

    function showControls(autoHide = true) {
      els.stage.classList.add("controls-visible");
      clearTimeout(hideControlsTimer);
      if (autoHide && !els.video.paused) {
        hideControlsTimer = setTimeout(() => {
          els.stage.classList.remove("controls-visible");
        }, 3000);
      }
    }

    function toggleDrawer(open) {
      els.drawer.classList.toggle("open", open);
      els.drawerBackdrop.classList.toggle("open", open);
    }

    function updatePlayIcon() {
      els.playIcon.innerHTML = els.video.paused
        ? '<polygon points="6 4 20 12 6 20 6 4"/>'
        : '<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>';
    }

    function updateVolumeIcon() {
      const muted = els.video.muted || els.video.volume === 0;
      els.volIcon.innerHTML = muted
        ? '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>'
        : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
    }

    function populateQualities() {
      const tracks = player.getVariantTracks();
      const uniqueHeights = [...new Set(tracks.map((t) => t.height).filter(Boolean))].sort((a, b) => b - a);

      els.qualitySelect.innerHTML = '<option value="auto">Auto Quality</option>';
      uniqueHeights.forEach((h) => {
        const opt = document.createElement("option");
        opt.value = h;
        opt.textContent = `${h}p`;
        els.qualitySelect.appendChild(opt);
      });
    }

    function updateTelemetry() {
      if (!player) return;
      const active = player.getVariantTracks().find((t) => t.active);
      if (!active) return;

      const res = active.height ? `${active.height}p` : "Live";
      const mbps = active.bandwidth ? `${(active.bandwidth / 1_000_000).toFixed(1)} Mbps` : "—";
      const mode = els.qualitySelect.value === "auto" ? "Auto" : "Manual";

      els.statRes.textContent = active.width && active.height ? `${active.width}×${active.height}` : res;
      els.statBitrate.textContent = mbps;
      els.topTelemetry.textContent = `${res} • ${mode}`;
    }

    async function switchStream(index) {
      currentIndex = index;
      const channel = channels[index];

      document.querySelectorAll(".channel-card, .drawer-item").forEach((el) => {
        el.classList.toggle("active", Number(el.dataset.index) === index);
      });

      els.overlayChannelName.textContent = channel.name;
      els.stage.classList.remove("has-error");
      els.stage.classList.add("is-loading");
      setOnlineStatus(true, "Connecting");

      player.configure({
        drm: { clearKeys: { [channel.kid]: channel.key } },
        abr: { enabled: true },
        streaming: {
          retryParameters: { maxAttempts: 4, baseDelay: 800, backoffFactor: 2 }
        }
      });

      try {
        await player.load(channel.url);
        populateQualities();
        updateTelemetry();
        setOnlineStatus(true, "Online");

        const playPromise = els.video.play();
        if (playPromise) {
          playPromise.catch(() => {
            els.video.muted = true;
            updateVolumeIcon();
            els.video.play().catch(() => {});
          });
        }
      } catch (err) {
        console.error("Stream load error:", err);
        els.stage.classList.remove("is-loading");
        els.stage.classList.add("has-error");
        els.errorMsg.textContent = `Could not connect to ${channel.name}. Tap retry to reconnect.`;
        setOnlineStatus(false, "Offline");
      }
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          if (els.stage.requestFullscreen) {
            await els.stage.requestFullscreen();
          } else if (els.stage.webkitRequestFullscreen) {
            els.stage.webkitRequestFullscreen();
          }
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock("landscape").catch(() => {});
          }
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      } catch (e) {
        console.warn("Fullscreen error:", e);
      }
    }

    function bindEvents() {
      // 1-tap toggle for controls
      els.stage.addEventListener("click", (e) => {
        if (e.target.closest("#controlBar, .overlay-top, .error-card")) {
          showControls(true);
          return;
        }
        if (els.stage.classList.contains("controls-visible")) {
          els.stage.classList.remove("controls-visible");
          clearTimeout(hideControlsTimer);
        } else {
          showControls(true);
        }
      });

      // Play / Pause
      els.playPauseBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        els.video.paused ? els.video.play() : els.video.pause();
        showControls(true);
      });

      els.video.addEventListener("play", () => { updatePlayIcon(); showControls(true); });
      els.video.addEventListener("pause", () => { updatePlayIcon(); showControls(false); });
      els.video.addEventListener("waiting", () => els.stage.classList.add("is-loading"));
      els.video.addEventListener("playing", () => {
        els.stage.classList.remove("is-loading", "has-error");
        setOnlineStatus(true, "Online");
        updateTelemetry();
      });

      // Volume & Mute
      els.muteBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        els.video.muted = !els.video.muted;
        els.volumeSlider.value = els.video.muted ? 0 : els.video.volume;
        updateVolumeIcon();
      });

      els.volumeSlider.addEventListener("input", (e) => {
        e.stopPropagation();
        els.video.volume = Number(e.target.value);
        els.video.muted = els.video.volume === 0;
        updateVolumeIcon();
      });

      // Jump to live edge
      els.liveSyncBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const range = player.seekRange();
        if (range && range.end > 0) {
          els.video.currentTime = Math.max(range.start, range.end - 1);
          els.video.play().catch(() => {});
        }
      });

      // Quality switcher
      els.qualitySelect.addEventListener("change", (e) => {
        e.stopPropagation();
        const val = e.target.value;
        if (val === "auto") {
          player.configure({ abr: { enabled: true } });
        } else {
          const targetHeight = Number(val);
          const match = player.getVariantTracks().find((t) => t.height === targetHeight);
          if (match) {
            player.configure({ abr: { enabled: false } });
            player.selectVariantTrack(match, true);
          }
        }
        updateTelemetry();
      });

      // Picture-in-Picture & Fullscreen
      els.pipBtn.addEventListener("click", async (e) => {
        e.stopPropagation();
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled) {
          await els.video.requestPictureInPicture().catch(() => {});
        }
      });

      els.fullscreenBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleFullscreen();
      });

      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement && screen.orientation && screen.orientation.unlock) {
          try { screen.orientation.unlock(); } catch (_) {}
        }
      });

      // Reload & Retry
      els.reloadBtn.addEventListener("click", () => switchStream(currentIndex));
      els.retryBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        switchStream(currentIndex);
      });

      // Drawer
      els.openDrawerBtn.addEventListener("click", () => toggleDrawer(true));
      els.closeDrawerBtn.addEventListener("click", () => toggleDrawer(false));
      els.drawerBackdrop.addEventListener("click", () => toggleDrawer(false));

      // Keyboard Shortcuts
      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
        if (e.key === "Escape") toggleDrawer(false);
        if (e.code === "Space") { e.preventDefault(); els.video.paused ? els.video.play() : els.video.pause(); }
        if (e.key.toLowerCase() === "m") { els.video.muted = !els.video.muted; updateVolumeIcon(); }
        if (e.key.toLowerCase() === "f") toggleFullscreen();
        if (["1", "2", "3", "4"].includes(e.key)) switchStream(Number(e.key) - 1);
      });
    }

    async function initApp() {
      renderChannelUI();
      bindEvents();
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        els.stage.classList.remove("is-loading");
        els.stage.classList.add("has-error");
        els.errorMsg.textContent = "This browser does not support Shaka Player.";
        setOnlineStatus(false, "Unsupported");
        return;
      }

      player = new shaka.Player();
      await player.attach(els.video);

      player.addEventListener("error", (event) => {
        console.error("Shaka Error:", event.detail);
      });

      player.addEventListener("adaptation", updateTelemetry);

      switchStream(0);
    }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
