<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>PBB STREAM ONLINE — Full Episodes</title>

  <!-- Preconnect to YouTube & Google APIs -->
  <link rel="preconnect" href="https://www.youtube.com" crossorigin />
  <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin />

  <link rel="stylesheet" href="style.css?v=4.0">
  <script disable-devtool-auto src="https://cdn.jsdelivr.net/npm/disable-devtool@0.3.9/disable-devtool.min.js"></script>
</head>
<body>
  <!-- Ambient macOS Wallpaper Orbs -->
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Ultra-Minimalist Splash Screen -->
  <div id="splash-screen">
    <div class="splash-content">
      <div class="brand-logo-wrapper">
        <img src="pbbstreamonline.png" alt="PBB Stream Online" class="brand-logo">
      </div>

      <div id="splash-loading-ui">
        <div class="splash-text">LOADING EPISODES</div>
        <div class="splash-loader"><div class="splash-progress"></div></div>
      </div>

      <button id="splash-enter-btn">ENTER STUDIO</button>
    </div>
  </div>

  <!-- Main macOS Window -->
  <div id="wrap" class="mac-window">
    <!-- macOS Window Titlebar -->
    <div class="mac-titlebar">
      <div class="traffic-lights">
        <span class="light close" title="Reload Episodes" id="tl-close"></span>
        <span class="light minimize" title="Toggle Sort Order" id="tl-sort"></span>
        <span class="light maximize" title="Full Screen" id="tl-fs"></span>
      </div>
      <div class="window-title">
        <span class="live-dot"></span>
        <span id="active-channel-title">PBB Collab 3.0 — Full Episodes</span>
      </div>
      <div class="viewer-pill" title="Watching Now">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        <span id="viewer-count">1</span>
      </div>
    </div>

    <div class="mac-content">
      <!-- YouTube Video Stage -->
      <div id="stage">
        <div id="yt-player-wrap">
          <div id="yt-player"></div>
        </div>

        <!-- Frosted Loading Overlay -->
        <div id="load" class="show">
          <div class="load-glass">
            <div class="arc"></div>
            <div class="t">Loading Episodes</div>
            <div class="s">Connecting to YouTube...</div>
          </div>
        </div>
      </div>

      <!-- macOS Frosted Sidebar / PBB Episodes List -->
      <div id="side">
        <div class="sidebar-header">
          <div class="sidebar-title-wrap">
            <div id="title">PBB EPISODES</div>
            <span id="ep-count-badge" class="count-pill">0</span>
          </div>
          <div class="header-badges">
            <button id="search-toggle-btn" class="tool-btn" title="Search Episodes">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button id="sort-btn" class="tool-btn" title="Sort Oldest / Newest">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="15" y2="12"></line><line x1="3" y1="18" x2="9" y2="18"></line></svg>
            </button>
            <button id="view-toggle-btn" class="tool-btn" title="Toggle List / Grid View">
              <svg id="view-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </button>
            <button id="donate-btn" class="support-badge" title="Support the Stream">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
              SUPPORT
            </button>
          </div>
        </div>

        <!-- Expandable Search Bar -->
        <div id="search-bar-wrap" class="hidden">
          <input type="text" id="ep-search" placeholder="Search episode, day, or date..." autocomplete="off">
          <button id="search-clear" title="Clear">×</button>
        </div>

        <!-- Episodes Container -->
        <div id="episodes"></div>

        <!-- Minimal Watermark Footer -->
        <div class="mac-footer">
          ENCODED BY PSYCHO PATTERN
        </div>
      </div>
    </div>
  </div>

  <!-- Premium Glass Support Modal -->
  <div id="support-modal" class="hidden">
    <div class="support-glass">
      <button id="close-support" class="modal-close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <div class="support-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#ff375f" stroke="none">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <h3 class="support-title">Support the Stream</h3>
      <p class="support-desc">Your contributions help maintain server costs and keep the studio running 24/7.</p>

      <div class="support-details">
        <div class="detail-row">
          <div class="detail-text">
            <span class="detail-label">GCash / Maya</span>
            <span class="detail-val" id="val-gcash">09626615296</span>
          </div>
          <button class="copy-btn" data-target="val-gcash" title="Copy Number">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>
        <div class="detail-row">
          <div class="detail-text">
            <span class="detail-label">Mari Bank</span>
            <span class="detail-val" id="val-mari">15978919557</span>
          </div>
          <button class="copy-btn" data-target="val-mari" title="Copy Number">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="data.js?v=4.0"></script>
  <script src="script.js?v=4.0"></script>
</body>
</html>
